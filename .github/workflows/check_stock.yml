name: Monitorar Estoque M5Paper (Telegram)

on:
  schedule:
    # Executa a cada hora no minuto 0 (ex: 13:00, 14:00...)
    - cron: '0 * * * *'
  # Permite rodar manualmente a qualquer momento
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar bibliotecas
        run: pip install requests

      - name: Verificar estoque e notificar via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import requests
          import os

          # URL da API do produto no Shopify da M5Stack
          url = "https://shop.m5stack.com/products/m5papermono-with-lora-nfc-800x480-3-97-eink-display.js"
          variant_id = 39966887903404

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          try:
              response = requests.get(url, headers=headers)
              data = response.json()
              
              available = False
              title = data.get("title", "M5Paper Mono")

              # Procura a variante do produto
              for variant in data.get("variants", []):
                  if variant.get("id") == variant_id:
                      available = variant.get("available", False)
                      price = variant.get("price", 0) / 100
                      break

              if available:
                  print("✅ PRODUTO EM ESTOQUE!")
                  msg = (
                      f"🚨 *PRODUTO DISPONÍVEL!* 🚨\n\n"
                      f"O *{title}* está em estoque por *${price:.2f}*!\n\n"
                      f"🔗 [Clique aqui para comprar](shop.m5stack.com/products/m5papermono-with-lora-nfc-800x480-3-97-eink-display?variant={variant_id})"
                  )
                  
                  if bot_token and chat_id:
                      telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                      payload = {
                          "chat_id": chat_id,
                          "text": msg,
                          "parse_mode": "Markdown",
                          "disable_web_page_preview": False
                      }
                      requests.post(telegram_url, json=payload)
              else:
                  print("❌ Produto continua fora de estoque.")

          except Exception as e:
              print(f"Erro ao verificar: {e}")
          EOF
